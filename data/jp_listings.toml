# 国内暗号資産交換業者の「新規取扱のお知らせ」発表履歴 (TRA-66)
#
# 全項目、各社の公告ページ／プレスリリース（一次情報）を 2026-11-14 に実際に取得して確認した値のみを記載する。
# 確認できなかった項目は「キーを省略」し、report 側に unknown とその理由を書く。
# 二次情報（まとめ記事等）由来の値はこのファイルには入れない。
#
# 対象期間: 2024-11-14 〜 2026-11-14 (直近24ヶ月)
# 対象業者: bitbank / GMOコイン / bitFlyer / Coincheck / SBI VCトレード / BITPOINT
#   OKCoinJapan: 取得不能 (robots.txt が ClaudeBot 等に対し Disallow: /。公告パスは許可リスト外)
#   DMM Bitcoin: 取得不能 (事業終了。bitcoin.dmm.com 接続不能。口座・資産はSBI VCトレードへ移管)
#
# announce_utc は「分単位まで一次情報で確定できた発表時刻」のみ記載する。
#   time_precision = "second" … 発表時刻が秒単位で取得できた (bitbank: microCMS publishedAt /
#                               Coincheck: STUDIO publishedAt / GMO: 公式RSS pubDate)
#   time_precision = "hour"   … 時までしか取得できなかった (announce_jst_hour に記載)
#   time_precision = "date"   … 日付のみ (announce_date_jst に記載)
#
# kind = "new_listing"      … その業者で新たに取扱う銘柄の発表
#        "migration"        … 既に取扱中の銘柄のトークン移行・改称 (RNDR→RENDER, MKR→SKY, LSKチェーン移行)
#        "new_service_type" … 既に取扱中の銘柄への取引種類追加 (板取引・信用取引の追加)
#
# first_in_jp は「国内初上場かどうか」。発表文に「国内初」「日本初」の明示がある場合、
#   および他の国内業者の取扱銘柄一覧に当該時点で存在しないことを確認できた場合に true。
#
# ref = 海外の参照市場。"binance" は現物 USDT ペア、"hyperliquid" は perp。
#   ref を省略している銘柄は海外参照市場が存在せず価格反応を測れない (no_ref_reason 参照)。

