# main に push (PR をマージ) されたら paper → live の順に Worker をデプロイする。
# 必要な GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# 各 Environment (paper / live) の変数:
#   WORKER_URL       Worker の URL (例 https://trade-bot-paper.<sub>.workers.dev)。
#                    設定するとデプロイ後に /healthz で新しい版の cron 完了を確認し、だめなら直前の版に戻す
#   ALLOW_UNMANAGED  (任意) 持ち高が残ったままデプロイから外すことを許す bot id (カンマ区切り)
# live に Required reviewers を付けると本番デプロイ前に承認を挟める。
# 詳しくは docs/ops.md
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイは常に 1 つずつ。実行中のデプロイは途中で止めない
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest
      - name: Ensure D1 is configured
        run: |
          if grep -q 'database_id = "00000000-0000-0000-0000-000000000000"' wrangler.toml; then
            echo "::error::wrangler.toml の database_id が未設定です。npm run setup:cloudflare を実行してコミットしてください"
            exit 1
          fi

  paper:
    needs: check
    uses: ./.github/workflows/deploy-worker.yml
    with:
      target: paper
    secrets: inherit

  # paper で新しい版が動いたことを確認してから live へ
  live:
    needs: paper
    uses: ./.github/workflows/deploy-worker.yml
    with:
      target: live
    secrets: inherit
