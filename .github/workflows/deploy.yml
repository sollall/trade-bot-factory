# main に push されたら paper と live の Worker をデプロイする。
# 必要な GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# live は GitHub Environment "live" を通るので、Settings > Environments で
# Required reviewers を設定すると本番デプロイ前に承認を挟める。
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest
      - name: Ensure D1 is configured
        run: |
          if grep -q 'database_id = "00000000-0000-0000-0000-000000000000"' wrangler.toml; then
            echo "::error::wrangler.toml の database_id が未設定です。npm run setup:cloudflare を実行してコミットしてください"
            exit 1
          fi

  deploy:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        target: [paper, live]
    environment: ${{ matrix.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python scripts/build_worker.py
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply trade-bot-${{ matrix.target }} --env ${{ matrix.target }} --remote
      - name: Deploy
        run: npx wrangler deploy --env ${{ matrix.target }}
