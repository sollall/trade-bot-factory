# 使い捨ての workflow (TRA-33)。エージェントは GitHub の API トークンを持たず push しかできないので、
# この branch への push で一度だけ PR の作成・コメント・マージを GITHUB_TOKEN で行う。
# 結果は RESULT.md としてこの branch に push し返す (エージェントは git fetch でだけ読めるため)。
# GITHUB_TOKEN による push は新しい workflow 実行を起こさないので再帰しない。
# 実行後、この branch は削除する。main には入れない。
name: Agent - open TRA-33 PR
on:
  push:
    branches: [agent/tra33-open-pr]

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  HEAD_BRANCH: agent/tra33-skip-empty-live
  BASE: main
  TITLE: "deploy: live に出す bot が 0 本なら live の段を飛ばす (TRA-33)"

jobs:
  open:
    if: "!contains(github.event.head_commit.message, '[agent-result]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open PR (idempotent)
        id: open
        continue-on-error: true
        run: |
          set -o pipefail
          if ! git ls-remote --exit-code --heads origin "$HEAD_BRANCH" >/dev/null; then
            echo "branch $HEAD_BRANCH が origin にありません" | tee "$RUNNER_TEMP/create.log"
            exit 1
          fi
          num=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE" --state open --json number --jq '.[].number' | head -1)
          if [ -n "$num" ]; then
            echo "PR #$num が既に開いています" | tee "$RUNNER_TEMP/create.log"
          else
            gh pr create --base "$BASE" --head "$HEAD_BRANCH" \
              --title "$TITLE" --body-file .github/tra33-pr.md 2>&1 | tee "$RUNNER_TEMP/create.log"
            num=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE" --state open --json number --jq '.[].number' | head -1)
          fi
          [ -n "$num" ] || { echo "PR 番号が取れませんでした" | tee -a "$RUNNER_TEMP/create.log"; exit 1; }
          echo "pr=$num" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        id: comment
        if: steps.open.outputs.pr != ''
        continue-on-error: true
        run: |
          set -o pipefail
          gh pr comment "${{ steps.open.outputs.pr }}" \
            --body-file .github/tra33-pr-comment.md 2>&1 | tee "$RUNNER_TEMP/comment.log"

      - name: Merge PR
        id: merge
        if: steps.open.outputs.pr != ''
        continue-on-error: true
        run: |
          set -o pipefail
          pr="${{ steps.open.outputs.pr }}"
          for i in 1 2 3 4 5 6 7 8; do
            state=$(gh pr view "$pr" --json mergeable,mergeStateStatus \
              --jq '[.mergeable // "?", .mergeStateStatus // "?"] | join(" ")' || echo "? ?")
            echo "試行 $i: $state" | tee -a "$RUNNER_TEMP/merge.log"
            case "$state" in
              MERGEABLE*) break ;;
            esac
            sleep 10
          done
          if ! gh pr merge "$pr" --merge 2>&1 | tee -a "$RUNNER_TEMP/merge.log"; then
            echo "--merge が通らないので --squash を試します" | tee -a "$RUNNER_TEMP/merge.log"
            gh pr merge "$pr" --squash 2>&1 | tee -a "$RUNNER_TEMP/merge.log"
          fi
          gh pr view "$pr" --json state,mergedAt,mergeCommit --jq . 2>&1 | tee -a "$RUNNER_TEMP/merge.log"

      - name: Report result back to this branch
        if: always()
        run: |
          {
            echo "# TRA-33 one-shot PR workflow の結果"
            echo
            echo "- 実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- PR 番号: \`${{ steps.open.outputs.pr }}\`"
            echo "- open: \`${{ steps.open.outcome }}\` / comment: \`${{ steps.comment.outcome }}\` / merge: \`${{ steps.merge.outcome }}\`"
            for f in create comment merge; do
              echo
              echo "## $f.log"
              echo '```'
              cat "$RUNNER_TEMP/$f.log" 2>/dev/null || echo "(ログなし)"
              echo '```'
            done
          } > RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESULT.md
          git commit -m "chore: TRA-33 one-shot PR workflow の結果 [agent-result] [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
