# 使い捨ての workflow (TRA-33)。エージェントは GitHub の API トークンを持たず push しかできないので、
# この branch への push で一度だけ GITHUB_TOKEN を使った操作を行う。
#
# 2026-11-21 (1): 承認待ちで `concurrency: group: deploy` を塞いでいた Deploy #5 (11-17) を
# `gh run cancel` で畳んだ。GITHUB_TOKEN は PR の create/approve は禁止されているが
# `actions: write` での実行キャンセルはできる。列が開いて Deploy #8 (1810c2b) が走り、
# paper worker が 11-17 の build から現在の main に更新された (bots 6 → 7)。
#
# 2026-11-21 (2): 残りは Deploy #8 の `live` 段の承認待ちだけ。オーナーは 11-17 に
# 「自動承認でもよい」と回答している。Environment の承認は pending_deployments API で行う。
# GITHUB_TOKEN が有効な reviewer として扱われるかは実測していないので、ここで試して
# 結果を RESULT.md に残す。live を宣言した bot は 0 本 (bots/*/bot.py は全部 deploy=["paper"])
# なので、承認しても live worker は毎分動いて何も判断しない。
#
# あわせて、オーナーが compare 画面から PR を作っていた場合はコメント+マージも行う
# (create だけが禁止されている)。結果は RESULT.md としてこの branch に push し返す。
# GITHUB_TOKEN による push は新しい workflow 実行を起こさないので再帰しない。
name: Agent - open TRA-33 PR
on:
  push:
    branches: [agent/tra33-open-pr]

permissions:
  contents: write
  pull-requests: write
  actions: write
  deployments: write

env:
  GH_TOKEN: ${{ github.token }}
  HEAD_BRANCH: agent/tra33-skip-empty-live
  BASE: main
  REPO: ${{ github.repository }}

jobs:
  approve:
    if: "!contains(github.event.head_commit.message, '[agent-result]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 承認待ちの Deploy を承認してみる
        id: approve
        continue-on-error: true
        shell: bash --noprofile --norc -o pipefail {0}
        run: |
          log="$RUNNER_TEMP/result.md"
          : > "$log"
          echo "## 承認待ちの Deploy を自動承認する試み ($(date -u +%FT%TZ))" >> "$log"
          echo >> "$log"

          echo "### 実行前" >> "$log"
          gh run list --workflow deploy.yml --limit 5 \
            --json number,status,conclusion,headSha \
            --jq '.[] | "- #\(.number) \(.status)/\(.conclusion // "-") \(.headSha[0:7])"' >> "$log" 2>&1 || true
          echo >> "$log"

          rid=$(gh run list --workflow deploy.yml --limit 20 \
                  --json databaseId,status \
                  --jq '[.[] | select(.status=="waiting")][0].databaseId')
          if [ -z "$rid" ] || [ "$rid" = "null" ]; then
            echo "承認待ちの Deploy はありません" >> "$log"
          else
            echo "### run $rid の pending_deployments" >> "$log"
            pend=$(gh api "repos/$REPO/actions/runs/$rid/pending_deployments" 2>&1) && rc=0 || rc=$?
            echo '```' >> "$log"; echo "$pend" | head -40 >> "$log"; echo '```' >> "$log"
            if [ "${rc:-1}" = "0" ]; then
              envid=$(echo "$pend" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d[0]["environment"]["id"] if d else "")' 2>/dev/null)
              echo "- environment id = ${envid:-(なし)}" >> "$log"
              if [ -n "$envid" ]; then
                echo "### 承認 API の結果" >> "$log"
                out=$(gh api --method POST "repos/$REPO/actions/runs/$rid/pending_deployments" \
                        -f state=approved \
                        -f "comment=TRA-33: live に出す bot は 0 本。オーナーは 11-17 に自動承認を了承済み" \
                        -F "environment_ids[]=$envid" 2>&1) && arc=0 || arc=$?
                echo '```' >> "$log"; echo "$out" | head -30 >> "$log"; echo '```' >> "$log"
                if [ "${arc:-1}" = "0" ]; then
                  echo "- **承認できました**" >> "$log"
                else
                  echo "- 承認できませんでした (rc=${arc})" >> "$log"
                fi
              fi
            fi
            echo >> "$log"
            echo "### 承認後 (最長10分)" >> "$log"
            for i in $(seq 1 20); do
              line=$(gh run view "$rid" --json status,conclusion --jq '"\(.status)/\(.conclusion // "-")"' 2>/dev/null)
              echo "- $(date -u +%H:%MZ) run $rid = $line" >> "$log"
              case "$line" in
                completed*) break ;;
              esac
              sleep 30
            done
          fi
          echo >> "$log"

          echo "### オーナー作成の PR" >> "$log"
          num=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE" --state open --json number --jq '.[].number' 2>/dev/null | head -1)
          if [ -n "$num" ]; then
            echo "- PR #$num を見つけたのでコメントしてマージします" >> "$log"
            gh pr comment "$num" --body-file .github/tra33-pr.md >/dev/null 2>&1 \
              && echo "- コメント済み" >> "$log" || echo "- コメント失敗" >> "$log"
            if out=$(gh pr merge "$num" --squash --delete-branch 2>&1); then
              echo "- マージ済み" >> "$log"
            else
              echo "- マージ失敗: $out" >> "$log"
            fi
          else
            echo "- PR はまだありません (create は GITHUB_TOKEN では禁止)" >> "$log"
          fi

          cp "$log" RESULT.md

      - name: 結果を branch に push し返す
        if: always()
        shell: bash --noprofile --norc -o pipefail {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f RESULT.md ] || echo "RESULT.md が作られませんでした" > RESULT.md
          git add RESULT.md
          git commit -m "chore: TRA-33 live 段の自動承認の結果 [agent-result] [skip ci]" || exit 0
          git push origin HEAD:agent/tra33-open-pr
