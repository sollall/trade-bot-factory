# 使い捨ての workflow (TRA-33)。エージェントは GitHub の API トークンを持たず push しかできないので、
# この branch への push で一度だけ PR の作成・コメント・マージを GITHUB_TOKEN で行う。
#
# 2026-11-19: 待ち受けの主経路を切り替えた。GITHUB_TOKEN による `gh pr create` はリポジトリ設定
# ("Allow GitHub Actions to create and approve pull requests") が入るまで通らず、11-18/11-19 の
# 2 回の待ち受けで合計 660 試行すべて拒否された。一方 **PR への コメントと マージは GITHUB_TOKEN で
# できる** (禁止されているのは create と approve だけ)。そこでループは毎回まず
# `gh pr list --head` で「オーナーが compare 画面から作った PR」を探し、見つかればそれに
# コメントしてマージする。設定が入っていれば従来どおり create も試みる (どちらが先でもよい)。
# → オーナーの操作は「Create pull request を押す」だけで済む。マージは押さなくてよい。
# 結果は RESULT.md としてこの branch に push し返す (エージェントは git fetch でだけ読めるため)。
# GITHUB_TOKEN による push は新しい workflow 実行を起こさないので再帰しない。
# 実行後、この branch は削除する。main には入れない。
name: Agent - open TRA-33 PR
on:
  push:
    branches: [agent/tra33-open-pr]

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  HEAD_BRANCH: agent/tra33-skip-empty-live
  BASE: main
  TITLE: "deploy: live に出す bot が 0 本なら live の段を飛ばす (TRA-33)"

jobs:
  open:
    if: "!contains(github.event.head_commit.message, '[agent-result]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open PR (idempotent, 設定が入るまで待つ)
        id: open
        timeout-minutes: 340
        continue-on-error: true
        # 既定の `bash -e` では、途中の 1 回の `gh` 失敗 (API の一時エラー等) で待ち受けごと
        # 落ちてしまう。11-18 の run 44373052549 が 5.5 時間のはずが 89 分で止まったのがこれ。
        # -e を外し、各コマンドの失敗を自分で扱う。
        shell: bash --noprofile --norc -o pipefail {0}
        run: |
          : > "$RUNNER_TEMP/create.log"
          if ! git ls-remote --exit-code --heads origin "$HEAD_BRANCH" >/dev/null; then
            echo "branch $HEAD_BRANCH が origin にありません" | tee -a "$RUNNER_TEMP/create.log"
            exit 1
          fi
          # "Allow GitHub Actions to create and approve pull requests" が入るまで 1 分おきに再試行する (最長 5.5 時間)。
          # 設定が入っていない間の失敗メッセージは 1 回だけ記録し、以降は 30 試行ごとに生存記録だけ残す。
          num=""
          for i in $(seq 1 330); do
            num=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE" --state open --json number --jq '.[].number' 2>/dev/null | head -1)
            if [ -n "$num" ]; then
              echo "試行 $i: PR #$num が開いています ($(date -u +%H:%MZ))" | tee -a "$RUNNER_TEMP/create.log"
              break
            fi
            out=$(gh pr create --base "$BASE" --head "$HEAD_BRANCH" \
              --title "$TITLE" --body-file .github/tra33-pr.md 2>&1) && rc=0 || rc=$?
            if [ "${rc:-1}" -eq 0 ]; then
              echo "試行 $i: 作成しました ($(date -u +%H:%MZ))" | tee -a "$RUNNER_TEMP/create.log"
              printf '%s\n' "$out" >> "$RUNNER_TEMP/create.log"
              num=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE" --state open --json number --jq '.[].number' 2>/dev/null | head -1)
              break
            fi
            if [ "$i" = "1" ]; then
              echo "試行 1 の失敗内容:" >> "$RUNNER_TEMP/create.log"
              printf '%s\n' "$out" >> "$RUNNER_TEMP/create.log"
            fi
            if [ $(( i % 30 )) -eq 0 ]; then
              echo "試行 $i: まだ作成できません ($(date -u +%H:%MZ))" | tee -a "$RUNNER_TEMP/create.log"
            fi
            sleep 60 || true
          done
          if [ -z "$num" ]; then
            echo "待ち受けが終わりました: オーナーが作った PR も見つからず、create も通りませんでした" >> "$RUNNER_TEMP/create.log"
            exit 1
          fi
          echo "pr=$num" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        id: comment
        if: steps.open.outputs.pr != ''
        continue-on-error: true
        run: |
          set -o pipefail
          gh pr comment "${{ steps.open.outputs.pr }}" \
            --body-file .github/tra33-pr-comment.md 2>&1 | tee "$RUNNER_TEMP/comment.log"

      - name: Merge PR
        id: merge
        if: steps.open.outputs.pr != ''
        continue-on-error: true
        run: |
          set -o pipefail
          pr="${{ steps.open.outputs.pr }}"
          for i in 1 2 3 4 5 6 7 8; do
            state=$(gh pr view "$pr" --json mergeable,mergeStateStatus \
              --jq '[.mergeable // "?", .mergeStateStatus // "?"] | join(" ")' || echo "? ?")
            echo "試行 $i: $state" | tee -a "$RUNNER_TEMP/merge.log"
            case "$state" in
              MERGEABLE*) break ;;
            esac
            sleep 10
          done
          if ! gh pr merge "$pr" --merge 2>&1 | tee -a "$RUNNER_TEMP/merge.log"; then
            echo "--merge が通らないので --squash を試します" | tee -a "$RUNNER_TEMP/merge.log"
            gh pr merge "$pr" --squash 2>&1 | tee -a "$RUNNER_TEMP/merge.log"
          fi
          gh pr view "$pr" --json state,mergedAt,mergeCommit --jq . 2>&1 | tee -a "$RUNNER_TEMP/merge.log"

      - name: Report result back to this branch
        if: always()
        run: |
          {
            echo "# TRA-33 one-shot PR workflow の結果"
            echo
            echo "- 実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- PR 番号: \`${{ steps.open.outputs.pr }}\`"
            echo "- open: \`${{ steps.open.outcome }}\` / comment: \`${{ steps.comment.outcome }}\` / merge: \`${{ steps.merge.outcome }}\`"
            for f in create comment merge; do
              echo
              echo "## $f.log"
              echo '```'
              cat "$RUNNER_TEMP/$f.log" 2>/dev/null || echo "(ログなし)"
              echo '```'
            done
          } > RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESULT.md
          git commit -m "chore: TRA-33 one-shot PR workflow の結果 [agent-result] [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
