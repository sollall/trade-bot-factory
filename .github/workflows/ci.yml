name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync
      - run: uv run pytest
      - run: npm ci
      - name: Build and bundle worker (dry run)
        run: |
          uv run python scripts/build_worker.py
          npx wrangler deploy --env paper --dry-run --outdir dist
