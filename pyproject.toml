[project]
name = "trade-bot-factory"
version = "0.1.0"
description = "Cloudflare Python Workers で動く売買 bot の工場 (paper / live / backtest)"
requires-python = ">=3.12"
# 本体は標準ライブラリのみ (Cloudflare 上でもそのまま動かすため)
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
