# DEX 間ファンディング・スクリーナー (シャドーモード) の設定
#
# 「会場 A でショート / 会場 B でロング」を同額建てて、ファンディング差だけで黒字になるかを監視する。
# 売買はしない。秘密鍵も API キーも使わない。公開 API の読み取りだけ。
#
# 会場そのものの定義 (エンドポイント・手数料・建て・地域制限) は venues_file 側。

venues_file = "data/venues.toml"

# 監視する銘柄 (会場ごとの表記は venues.toml の symbols で対応づける)
symbols = ["BTC", "ETH"]

# 片脚あたりの建玉 (USD)。板を成行で食べたときのスリッページを測るサイズ
sizes_usd = [1_000, 5_000, 20_000, 100_000]

# 控除後の年率を出す保有期間 (日)
hold_days = [7, 14, 30]
# ランキングと「機会」判定に使う保有期間
rank_hold_days = 14

# net_apr(rank_hold_days) がこの年率 (小数) 以上なら「機会」としてエピソードを開始する。
# 0.05 = 年率 5%。資金を 2 会場に分けて置くリスクに対して、これ未満は見る価値がないという意味。
min_net_apr = 0.05

# ポーリング間隔の既定 (venues.toml の poll_interval_sec で会場ごとに上書き)。
# BAN されると計測が止まるので保守的に。
poll_interval_sec = 15
# 直近の取得からこれ以上古いスナップショットはペア計算に使わない (会場が落ちている間の見せかけの機会を防ぐ)
max_stale_sec = 180

# スプレッドの集計バケット (秒)。行数を抑えるため既定 5 分
spread_bucket_sec = 300
# 生データ (polls) の保持日数
retention_days = 14

# 板の取得本数の既定 (venues.toml の book_depth で会場ごとに上書き)
book_depth = 100

# ランキングとウォークフォワードで使う基準サイズ (片脚 USD)。
# 「良い数字が出るサイズ」を後から選ばないよう、ここで先に 1 つ宣言しておく。
# サイズごとの内訳は report が sizes_usd の全てについて別に出す。
ref_size_usd = 5_000

# ---- report のウォークフォワード区間 ----
# 「前の窓で一番良かった会場ペア」を次の窓で持った場合の成績 (OOS) と、
# 後から見た最良ペアに対する比 (効率) を窓ごとに出す。後知恵でペアを選ぶ誘惑への歯止め。
walkforward_windows = 7
