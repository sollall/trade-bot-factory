# DEX 間ファンディング・スクリーナー (シャドーモード) の設定
#
# 「会場 A でショート / 会場 B でロング」を同額建てて、ファンディング差だけで黒字になるかを監視する。
# 売買はしない。秘密鍵も API キーも使わない。公開 API の読み取りだけ。
#
# 会場そのものの定義 (エンドポイント・手数料・建て・地域制限) は venues_file 側。

venues_file = "data/venues.toml"

# 監視する銘柄 (会場ごとの表記は venues.toml の symbols で対応づける)
symbols = ["BTC", "ETH"]

# 片脚あたりの建玉 (USD)。板を成行で食べたときのスリッページを測るサイズ
sizes_usd = [1_000, 5_000, 20_000, 100_000]

# 控除後の年率を出す保有期間 (日)
hold_days = [7, 14, 30]
# ランキングと「機会」判定に使う保有期間
rank_hold_days = 14

# net_apr(rank_hold_days) がこの年率 (小数) 以上なら「機会」としてエピソードを開始する。
# 0.05 = 年率 5%。資金を 2 会場に分けて置くリスクに対して、これ未満は見る価値がないという意味。
min_net_apr = 0.05

# ポーリング間隔の既定 (venues.toml の poll_interval_sec で会場ごとに上書き)。
# BAN されると計測が止まるので保守的に。
poll_interval_sec = 15
# ファンディングレートがこれ以上古いスナップショットはペア計算に使わない
# (会場が落ちている間の見せかけの機会を防ぐ)
max_stale_sec = 180
# 価格と板はこれより古いものを混ぜない。
# ファンディングレートなら 3 分古くても困らないが、会場間の価格差 (basis) と
# スリッページは「3 分前の板」と「今の板」を混ぜると時刻のずれを差として測ってしまう
# (BTC は 3 分で 10bps 平気で動く)。そのため価格系だけ別の鮮度で切る。
max_price_stale_sec = 30

# スプレッドの集計バケット (秒)。行数を抑えるため既定 5 分
spread_bucket_sec = 300
# 生データ (polls) の保持日数
retention_days = 14

# 板の取得本数の既定 (venues.toml の book_depth で会場ごとに上書き)
book_depth = 100

# ランキングとウォークフォワードで使う基準サイズ (片脚 USD)。
# 「良い数字が出るサイズ」を後から選ばないよう、ここで先に 1 つ宣言しておく。
# サイズごとの内訳は report が sizes_usd の全てについて別に出す。
ref_size_usd = 5_000

# ---- 確定ファンディングでの主指標 (backfill) ----
# ライブ計測で取れるのは各会場が今返している「予測レート」で、net_apr(14d) は
# それが 14 日続くという外挿。7 日のライブ計測では 14 日保有の損益は検証できない。
# 各会場には確定済みファンディングの履歴 API があるので、そこから遡って
# 「ある時点で建てて hold 日後に解消したとき、実際に確定した差はいくらか」を主指標にする。
backfill_days = 90
# 建てる時刻の格子 (時間)。細かくしても近い建玉が重なるだけなので 6 時間
entry_grid_hours = 6
# 保有期間のうち両会場のデータがこの割合なければ、その建玉は評価しない
min_coverage = 0.9

# 片脚の建玉に対するレバレッジ。net_apr は「片脚の建玉」に対する率なので、
# 資本に対する利回りに直すのに使う (証拠金は 2 会場ぶん必要)。
# 1.0 = フル担保 -> 資本基準の利回りは片脚建玉基準の半分。
leverage = 1.0

# ---- report のウォークフォワード区間 ----
# 「前の窓で一番良かった会場ペア」を次の窓で持った場合の成績 (OOS) と、
# 後から見た最良ペアに対する比 (効率) を窓ごとに出す。後知恵でペアを選ぶ誘惑への歯止め。
walkforward_windows = 7
